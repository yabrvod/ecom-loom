<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title layout:title-pattern="$CONTENT_TITLE — Tienda">Tienda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

<nav class="bg-white shadow-sm border-b border-gray-200">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <a th:href="@{/}" class="text-xl font-bold text-indigo-600">🛍 Tienda</a>
    <div class="flex items-center gap-6 text-sm">
      <a th:href="@{/}" class="text-gray-600 hover:text-indigo-600">Catálogo</a>
      <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="text-gray-600 hover:text-indigo-600">Admin</a>
      <a th:href="@{/carrito}" class="relative text-gray-600 hover:text-indigo-600">
        🛒 Carrito
      </a>
      <span sec:authorize="isAuthenticated()" class="text-gray-500 flex items-center gap-2">
        Hola, <strong sec:authentication="name"></strong> ·
        <form th:action="@{/logout}" method="post" class="inline">
          <button type="submit" class="text-red-500 hover:underline text-sm">Salir</button>
        </form>
      </span>
      <span sec:authorize="isAnonymous()">
        <a th:href="@{/login}" class="text-indigo-600 hover:underline">Ingresar</a>
      </span>
    </div>
  </div>
</nav>

<div th:if="${mensaje}" class="bg-green-50 border-b border-green-200 text-green-700 text-sm text-center py-2"
     th:text="${mensaje}"></div>
<div th:if="${error}" class="bg-red-50 border-b border-red-200 text-red-700 text-sm text-center py-2"
     th:text="${error}"></div>

<main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8" layout:fragment="content">
</main>

<footer class="bg-white border-t border-gray-200 text-center text-xs text-gray-400 py-4">
  Spring Boot 3 + Java 24 · Hibernate (checkout) + jOOQ (catálogo) · HTMX
</footer>

<script>
  // CSRF para HTMX
  document.addEventListener('htmx:configRequest', e => {
    const token = document.querySelector('meta[name="_csrf"]')?.content;
    const header = document.querySelector('meta[name="_csrf_header"]')?.content;
    if (token && header) e.detail.headers[header] = token;
  });
</script>
</body>
</html>
