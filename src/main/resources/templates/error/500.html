<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Error</title></head>
<body>
<div layout:fragment="content">
  <div class="text-center py-20">
    <p class="text-7xl mb-4">⚠️</p>
    <h1 class="text-3xl font-bold text-gray-800 mb-2">Error interno</h1>
    <p class="text-gray-500 mb-6" th:text="${error} ?: 'Ha ocurrido un error inesperado.'"></p>
    <a th:href="@{/}" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">Volver al catálogo</a>
  </div>
</div>
</body>
</html>
