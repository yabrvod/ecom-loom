<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Carrito</title></head>
<body>
<div layout:fragment="content">

  <h1 class="text-2xl font-bold text-gray-900 mb-8">Tu carrito</h1>

  <div th:if="${#lists.isEmpty(items)}" class="text-center py-16 text-gray-400">
    <p class="text-5xl mb-4">🛒</p>
    <p class="text-lg mb-4">Tu carrito está vacío</p>
    <a th:href="@{/}" class="bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700">
      Ver catálogo
    </a>
  </div>

  <div th:unless="${#lists.isEmpty(items)}" class="grid grid-cols-1 lg:grid-cols-3 gap-8">

    <!-- Items enriquecidos con nombre y precio via jOOQ -->
    <div class="lg:col-span-2 space-y-4">
      <div th:each="item : ${items}"
           class="bg-white border border-gray-200 rounded-xl p-4 flex items-center gap-4">

        <div class="bg-indigo-50 rounded-lg w-16 h-16 flex items-center justify-center text-2xl flex-shrink-0">
          🛍
        </div>

        <div class="flex-1">
          <p class="font-semibold text-gray-800" th:text="${item.productName}"></p>
          <p class="text-sm text-gray-500" th:text="${item.variantName}"></p>
          <p class="text-indigo-600 font-bold text-sm"
             th:text="${'$' + #numbers.formatInteger(item.price, 0, 'COMMA')}"></p>
        </div>

        <!-- Cantidad con botones +/- para evitar doble submit del onchange -->
        <form th:action="@{/carrito/actualizar}" method="post" class="flex items-center gap-1">
          <input type="hidden" name="variantId" th:value="${item.variantId}"/>
          <button type="submit" name="quantity" th:value="${item.quantity - 1}"
                  class="w-7 h-7 border border-gray-300 rounded text-gray-600 hover:bg-gray-100 text-sm font-bold">−</button>
          <span class="w-8 text-center text-sm font-medium" th:text="${item.quantity}"></span>
          <button type="submit" name="quantity" th:value="${item.quantity + 1}"
                  class="w-7 h-7 border border-gray-300 rounded text-gray-600 hover:bg-gray-100 text-sm font-bold">+</button>
        </form>

        <!-- Subtotal -->
        <p class="font-semibold text-sm w-24 text-right"
           th:text="${'$' + #numbers.formatInteger(item.subtotal, 0, 'COMMA')}"></p>

        <!-- Eliminar -->
        <form th:action="@{/carrito/eliminar/{vid}(vid=${item.variantId})}" method="post">
          <button type="submit" class="text-red-400 hover:text-red-600 text-xl"
                  onclick="this.disabled=true; this.form.submit()">✕</button>
        </form>
      </div>
    </div>

    <!-- Resumen + Checkout -->
    <div class="bg-white border border-gray-200 rounded-xl p-6 h-fit">
      <h2 class="font-bold text-gray-800 text-lg mb-4">Resumen</h2>
      <div class="flex justify-between text-sm text-gray-600 mb-2">
        <span>Subtotal</span>
        <span th:text="${'$' + #numbers.formatInteger(total, 0, 'COMMA')}"></span>
      </div>
      <hr class="my-4"/>
      <div class="flex justify-between font-bold text-gray-900 mb-4">
        <span>Total</span>
        <span class="text-indigo-600" th:text="${'$' + #numbers.formatInteger(total, 0, 'COMMA')}"></span>
      </div>

      <form th:action="@{/carrito/checkout}" method="post" class="space-y-3">
        <div>
          <label class="block text-xs text-gray-500 mb-1">Nombre envío</label>
          <input type="text" name="shippingName" required
                 class="w-full border border-gray-300 rounded px-3 py-2 text-sm"/>
        </div>
        <div>
          <label class="block text-xs text-gray-500 mb-1">Dirección</label>
          <textarea name="shippingAddress" required rows="2"
                    class="w-full border border-gray-300 rounded px-3 py-2 text-sm"></textarea>
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 text-white font-semibold py-3 rounded-lg hover:bg-indigo-700">
          Confirmar pedido
        </button>
      </form>
    </div>
  </div>

</div>
</body>
</html>
