<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title th:text="${product.name}">Producto</title></head>
<body>
<div layout:fragment="content">

  <nav class="text-sm text-gray-500 mb-6">
    <a th:href="@{/}" class="hover:text-indigo-600">Catálogo</a>
    <span class="mx-2">›</span>
    <a th:href="@{/(category=${product.categorySlug})}" class="hover:text-indigo-600"
       th:text="${product.categoryName}"></a>
    <span class="mx-2">›</span>
    <span class="text-gray-800" th:text="${product.name}"></span>
  </nav>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">

    <!-- Imagen -->
    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-2xl h-96 flex items-center justify-center text-8xl">
      🛍
    </div>

    <!-- Info -->
    <div>
      <p class="text-sm text-indigo-500 font-medium mb-1" th:text="${product.categoryName}"></p>
      <h1 class="text-3xl font-bold text-gray-900 mb-3" th:text="${product.name}"></h1>
      <p class="text-gray-600 mb-6" th:text="${product.description}"></p>

      <!-- Variantes con stock -->
      <div>
        <h3 class="font-semibold text-gray-700 mb-3">Selecciona una variante:</h3>

        <!-- Un form por variante — simple, sin JS, infalible -->
        <div class="grid grid-cols-2 gap-3 mb-6">
          <form th:each="v : ${product.variants}"
                th:action="@{/carrito/agregar}" method="post">
            <input type="hidden" name="variantId" th:value="${v.id}"/>
            <input type="hidden" name="quantity" value="1"/>
            <button type="submit"
                    th:if="${v.inStock}"
                    onclick="this.disabled=true; this.form.submit()"
                    th:classappend="${v.inStock} ? 'border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 cursor-pointer' : 'border-gray-100 bg-gray-50 opacity-50 cursor-not-allowed'"
                    class="w-full text-left border-2 rounded-lg p-3 transition-colors">
              <p class="font-medium text-sm text-gray-800" th:text="${v.name}"></p>
              <p class="text-indigo-600 font-bold text-sm"
                 th:text="${'$' + #numbers.formatInteger(v.price, 0, 'COMMA')}"></p>
              <p class="text-xs mt-1"
                 th:classappend="${v.inStock} ? 'text-green-600' : 'text-red-400'"
                 th:text="${v.inStock} ? ${v.stock + ' disponibles'} : 'Sin stock'"></p>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
